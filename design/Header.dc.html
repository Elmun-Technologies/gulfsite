<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>GFF Uzbekistan — Header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300;0,400;0,500;0,600;1,400&amp;family=Onest:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="font-family: 'Urbanist', 'Onest', 'Helvetica Neue', sans-serif; color: #14132E; background: #FFFFFF; width: 100%;">
<header style="max-width: 1408px; margin: 0 auto; padding: 16px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px;">
<a href="{{homeHref}}" aria-label="GFF Uzbekistan" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #14132E;">
<img src="assets/monogram-copper.png" alt="" style="{{logoStyle}}">
<span style="display: flex; flex-direction: column; gap: 5px;">
<span style="{{wordStyle}}">GULF FLAVOURS &amp; FRAGRANCES</span>
<span style="{{subStyle}}">UZBEKISTAN</span>
</span>
</a>

<sc-if value="{{wide}}" hint-placeholder-val="{{true}}">
<nav aria-label="Menu" style="display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 16px; font-weight: 500;">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<a href="{{item.href}}" style="{{item.style}}">{{item.label}}</a>
</sc-for>
</nav>
<div style="display: flex; align-items: center; gap: 10px;">
<div role="group" aria-label="Til" style="display: flex; padding: 3px; border-radius: 999px; border: 1px solid #E3DAD0;">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<a href="{{l.href}}" aria-current="{{l.current}}" style="{{l.style}}">{{l.label}}</a>
</sc-for>
</div>
<a href="Samples.dc.html" style="display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 22px; border-radius: 999px; background: #0B0A3A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500;">{{ctaLabel}}
<span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #D6A27C; color: #14132E; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;">{{count}}</span>
</a>
</div>
</sc-if>

<sc-if value="{{narrow}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 8px;">
<a href="Samples.dc.html" aria-label="{{ctaLabel}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 999px; background: #0B0A3A; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>
<span style="min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #D6A27C; color: #14132E; font-size: 12px; display: inline-flex; align-items: center; justify-content: center;">{{count}}</span>
</a>
<button type="button" onClick="{{toggleMenu}}" aria-expanded="{{openAttr}}" aria-label="Menu" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E3DAD0; background: #FFFFFF; color: #14132E; display: flex; align-items: center; justify-content: center; cursor: pointer;">
<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</sc-if>
<sc-if value="{{closed}}" hint-placeholder-val="{{true}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</sc-if>
</button>
</div>
</sc-if>
</header>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div style="padding: 0 16px 16px;">
<nav aria-label="Menu" style="background: #0B0A3A; color: #FFFFFF; border-radius: 32px; padding: 28px; display: flex; flex-direction: column; gap: 4px;">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<a href="{{item.href}}" style="{{item.mStyle}}">{{item.label}}</a>
</sc-for>
<div style="display: flex; gap: 8px; padding-top: 20px;">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<a href="{{l.href}}" aria-current="{{l.current}}" style="{{l.mStyle}}">{{l.label}}</a>
</sc-for>
</div>
<a href="Samples.dc.html" style="margin-top: 12px; display: inline-flex; align-items: center; justify-content: center; height: 52px; border-radius: 999px; background: #D6A27C; color: #14132E; text-decoration: none; font-size: 16px; font-weight: 600;">{{freeLabel}}</a>
</nav>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","catalog","industries","samples","about","contact","none"],"default":"home"},"lang":{"editor":"enum","options":["uz","ru","en"],"default":"uz"},"count":{"editor":"int","default":0,"min":0,"max":8},"$preview":{"width":1440,"height":96}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { narrow: false, open: false };
    this.onResize = () => {
      const n = window.innerWidth < 1080;
      if (n !== this.state.narrow) this.setState({ narrow: n, open: false });
    };
  }
  componentDidMount() { this.onResize(); window.addEventListener('resize', this.onResize); }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  renderVals() {
    const active = this.props.active ?? 'home';
    const lang = this.props.lang ?? 'uz';
    const { narrow, open } = this.state;
    const T = {
      uz: { nav: ['Katalog', 'Sohalar', 'Namuna olish', 'Kompaniya', 'Aloqa'], cta: 'Namuna qutisi', free: 'Bepul namuna' },
      ru: { nav: ['Каталог', 'Отрасли', 'Образцы', 'Компания', 'Контакты'], cta: 'Коробка образцов', free: 'Бесплатные образцы' },
      en: { nav: ['Catalogue', 'Industries', 'Samples', 'Company', 'Contact'], cta: 'Sample box', free: 'Free samples' }
    }[lang] || {};
    const ids = ['catalog', 'industries', 'samples', 'about', 'contact'];
    const hrefs = ['Catalog.dc.html', 'Industries.dc.html', 'Samples.dc.html', 'About.dc.html', 'Contact.dc.html'];
    const base = 'text-decoration: none; padding: 10px 0; color: #14132E; border-bottom: 2px solid ';
    const langBase = 'text-decoration: none; display: inline-flex; align-items: center; justify-content: center; height: 38px; min-width: 44px; padding: 0 10px; border-radius: 999px; font-size: 14px; font-weight: 600; box-sizing: border-box; ';
    const langs = [['uz', 'UZ', 'Main.dc.html'], ['ru', 'RU', 'Main.ru.dc.html'], ['en', 'EN', 'Main.dc.html']].map(([id, label, href]) => ({
      label, href, current: id === lang ? 'true' : 'false',
      style: langBase + (id === lang ? 'background: #14132E; color: #FFFFFF;' : 'background: transparent; color: #615E72;'),
      mStyle: langBase + 'flex: 1 1 0; height: 48px; ' + (id === lang ? 'background: #FFFFFF; color: #14132E;' : 'border: 1px solid #4A4878; color: #FFFFFF;')
    }));
    return {
      items: ids.map((id, i) => ({
        label: T.nav[i], href: hrefs[i],
        style: base + (id === active ? '#14132E;' : 'transparent;'),
        mStyle: 'text-decoration: none; padding: 12px 0; font-size: 30px; font-weight: 400; letter-spacing: -0.02em; border-bottom: 1px solid #26254A; color: ' + (id === active ? '#E8C3A3;' : '#FFFFFF;')
      })),
      langs,
      homeHref: lang === 'ru' ? 'Main.ru.dc.html' : 'Main.dc.html',
      ctaLabel: T.cta, freeLabel: T.free,
      count: this.props.count ?? 0,
      wide: !narrow, narrow, open, closed: !open,
      menuOpen: narrow && open,
      openAttr: open ? 'true' : 'false',
      toggleMenu: () => this.setState({ open: !this.state.open }),
      logoStyle: 'width: auto; display: block; height: ' + (narrow ? '40px;' : '48px;'),
      wordStyle: 'font-weight: 600; line-height: 1; font-size: ' + (narrow ? '10px; letter-spacing: 0.12em;' : '13px; letter-spacing: 0.16em;'),
      subStyle: 'font-weight: 600; line-height: 1; color: #94603E; font-size: ' + (narrow ? '9px; letter-spacing: 0.28em;' : '11px; letter-spacing: 0.32em;')
    };
  }
}
</script>
</body>
</html>
